<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ Family Feast Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🍽️ Family Feast Planner</h1>

    <div class="nav-buttons">
        <button onclick="scrollToSection('recipes')">🍝 Recipes</button>
        <button onclick="scrollToSection('planner')">📅 Planner</button>
        <button onclick="scrollToSection('shopping')">🛒 Shopping</button>
    </div>
</header>

<section class="hero">
    <h2>Healthy Family Dinners Made Easy</h2>

    <p>
        Quick, healthy and family-friendly meals for busy weeknights.
    </p>

    <button onclick="pickDinner()">
        🎲 What's For Dinner Tonight?
    </button>

    <div id="result"></div>
</section>

<section id="recipes">

    <h2>🍝 Browse Recipes</h2>

    <div class="filters">

        <select id="cuisineFilter" onchange="filterRecipes()">
            <option value="all">All Cuisines</option>
            <option value="Italian">Italian</option>
            <option value="British">British</option>
            <option value="Mexican">Mexican</option>
            <option value="American">American</option>
        </select>

        <select id="typeFilter" onchange="filterRecipes()">
            <option value="all">All Types</option>
            <option value="Chicken">Chicken</option>
            <option value="Beef">Beef</option>
            <option value="Fish">Fish</option>
            <option value="Vegetarian">Vegetarian</option>
        </select>

    </div>

    <div id="recipeContainer" class="recipe-grid"></div>

</section>

<section id="planner">

    <h2>📅 Weekly Meal Planner</h2>

    <div id="plannerGrid"></div>

</section>

<section id="shopping">

    <h2>🛒 Shopping List</h2>

    <button onclick="generateShoppingList()">
        Generate Shopping List
    </button>

    <ul id="shoppingList"></ul>

</section>

<script src="app.js"></script>

</body>
</html>
